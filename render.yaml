services:
  - type: web
    name: news-portal
    env: php
    plan: free
    region: singapore
    buildCommand: composer install --no-dev --optimize-autoloader && npm install && npm run build
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: news-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: news-portal-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: news-portal-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: news-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: news-portal-db
          property: password

databases:
  - name: news-portal-db
    plan: free
    region: singapore
    databaseName: news_portal
    user: news_user
